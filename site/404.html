<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not here — ELSEWHERE</title>
<style>
  html,body{height:100%;margin:0}
  body{background:#06070a;color:#e9e7e0;display:grid;place-items:center;padding:32px;
       font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
  .k{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:11px;
     letter-spacing:.28em;text-transform:uppercase;color:#5d5d58;margin-bottom:18px}
  h1{font-size:clamp(28px,6vw,44px);font-weight:600;letter-spacing:-.03em;margin:0 0 10px}
  p{color:#8d8c85;font-size:14px;max-width:34ch;margin:0 auto 26px;line-height:1.6}
  a{display:inline-block;padding:12px 22px;border-radius:10px;background:#d8ff3e;color:#07080a;
    text-decoration:none;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
  .ring{width:56px;height:56px;border-radius:50%;border:1.5px solid rgba(216,255,62,.45);
        margin:0 auto 26px;display:grid;place-items:center}
  .ring i{width:6px;height:6px;border-radius:50%;background:#d8ff3e;display:block}
</style>
</head>
<body>
  <main>
    <div class="ring"><i></i></div>
    <div class="k">404</div>
    <h1>This is not a place.</h1>
    <p>There is nothing at this address. The generator lives at the root.</p>
    <a href="/">Generate a point</a>
  </main>
</body>
</html>
